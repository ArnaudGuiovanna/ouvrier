name: ci

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ouvrier
          POSTGRES_PASSWORD: ouvrier
          POSTGRES_DB: ouvrier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouvrier -d ouvrier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      OUVRIER_TEST_POSTGRES_DSN: postgres://ouvrier:ouvrier@127.0.0.1:5432/ouvrier_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Install audit sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap
          sudo apparmor_parser -r \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Verify audit sandbox namespaces
        run: |
          bwrap --die-with-parent --unshare-all --unshare-user --new-session \
            --disable-userns --cap-drop ALL --ro-bind /usr /usr \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev --clearenv --setenv PATH /usr/bin:/bin \
            -- /usr/bin/true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: No build chain in internal/console (no-CDN invariant)
        run: |
          # The console SPA is vendored Preact + HTM ESM served from //go:embed.
          # There must be no npm/bundler footprint under internal/console, and
          # `go build` alone must embed all assets.
          offenders=$(find internal/console \
            \( -name node_modules -o -name package.json -o -name package-lock.json \
               -o -name yarn.lock -o -name pnpm-lock.yaml \) -print)
          if [ -n "$offenders" ]; then
            echo "internal/console must have no npm/bundler footprint:" >&2
            echo "$offenders" >&2
            exit 1
          fi
          go build ./internal/console

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: staticcheck
        run: staticcheck ./...

      - name: go test
        run: go test ./...

  cockpit-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    defaults:
      run:
        working-directory: spikes/adk-cockpit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true
          cache-dependency-path: spikes/adk-cockpit/go.sum

      - name: Download and verify isolated module
        run: |
          go mod download
          go mod verify

      - name: Vet isolated cockpit spike
        run: go vet ./...

      - name: Test isolated cockpit spike
        run: go test -count=1 ./...

      - name: Race-test isolated cockpit spike
        run: go test -race -count=1 ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ouvrier
          POSTGRES_PASSWORD: ouvrier
          POSTGRES_DB: ouvrier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouvrier -d ouvrier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      OUVRIER_TEST_POSTGRES_DSN: postgres://ouvrier:ouvrier@127.0.0.1:5432/ouvrier_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Install audit sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles bubblewrap
          sudo apparmor_parser -r \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Verify audit sandbox namespaces
        run: |
          bwrap --die-with-parent --unshare-all --unshare-user --new-session \
            --disable-userns --cap-drop ALL --ro-bind /usr /usr \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev --clearenv --setenv PATH /usr/bin:/bin \
            -- /usr/bin/true

      - name: Race tests for concurrency-sensitive packages
        run: |
          go test -race -count=1 \
            . \
            ./internal/runtime/... \
            ./internal/state/... \
            ./internal/events/... \
            ./internal/tools/... \
            ./internal/harness/... \
            ./internal/operate/... \
            ./internal/cli/... \
            ./internal/provider/... \
            ./internal/tunnel/... \
            ./internal/console/...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Build ouvrier CLI
        run: go build ./cmd/ouvrier
