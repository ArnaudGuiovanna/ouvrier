name: ci

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ouvrier
          POSTGRES_PASSWORD: ouvrier
          POSTGRES_DB: ouvrier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouvrier -d ouvrier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      OUVRIER_TEST_POSTGRES_DSN: postgres://ouvrier:ouvrier@127.0.0.1:5432/ouvrier_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: staticcheck
        run: staticcheck ./...

      - name: go test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ouvrier
          POSTGRES_PASSWORD: ouvrier
          POSTGRES_DB: ouvrier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouvrier -d ouvrier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOTOOLCHAIN: local
      OUVRIER_TEST_POSTGRES_DSN: postgres://ouvrier:ouvrier@127.0.0.1:5432/ouvrier_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Race tests for concurrency-sensitive packages
        run: |
          go test -race \
            ./internal/runtime/... \
            ./internal/state/... \
            ./internal/events/... \
            ./internal/tools/... \
            ./internal/harness/...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Build ouvrier CLI
        run: go build ./cmd/ouvrier
