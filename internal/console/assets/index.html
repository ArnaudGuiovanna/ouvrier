<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ouvrier console</title>
  <link rel="stylesheet" href="/app.css" />
  <!-- Import map resolves the bare "preact" specifier the vendored hooks
       module imports, so everything stays first-party (CSP default-src 'self'). -->
  <script type="importmap">
    {
      "imports": {
        "preact": "/vendor/preact.module.js",
        "preact/hooks": "/vendor/hooks.module.js",
        "htm": "/vendor/htm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
